<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Круг ТВ</title>
  <!-- Open Graph для соцсетей -->
<meta property="og:title" content="МИШКА ТВ — Круг 24/7" />
<meta property="og:description" content="Круг по кругу. Эфир Михаила Круга без остановки — с VHS шумом, телевизором и душой." />
<meta property="og:image" content="https://mishakaifuev.github.io/mishka-tv/preview.png" />
<meta property="og:url" content="https://mishakaifuev.github.io/mishka-tv/" />
<meta property="og:type" content="website" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="МИШКА ТВ — Круг 24/7" />
<meta name="twitter:description" content="Михаил Круг в непрерывном эфире. С любовью, с VHS, с отголоском 90-х." />
<meta name="twitter:image" content="https://mishakaifuev.github.io/mishka-tv/preview.png" />

  <link rel="stylesheet" href="style.css" />
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <div class="container">
    <div class="video-frame">
      <div class="live-tag">ЭФИР</div>
      <div id="player"></div>
    </div>
    <img src="logo.png" class="logo" alt="МИШКА ТВ" />
    <img src="tv.png" class="tv" alt="Телевизор" />
    <div class="vhs-noise"></div>
  </div>

  <div class="ticker">
    <p>Сегодня в эфире: Владимирский Централ · Кольщик · Звёздная пурга · Таганка · Михаил Круг в студии "РетроТВ"</p>
  </div>

  <button id="mute-button">🔇 Выключить звук</button>

  <script>
    const videos = [
      '_wnQ3Ow02yQ', // Владимирский Централ
      'mlOeHmUTbwg', // Пришелец
      '7C7DLnCYrP8'  // Таганка
    ];

    let player;
    let currentIndex = 0;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '540',
        width: '676',
        videoId: videos[currentIndex],
        playerVars: {
          autoplay: 1,
          controls: 0,
          rel: 0,
          mute: 1, // сначала mute, чтобы autoplay сработал
          modestbranding: 1,
          fs: 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      event.target.playVideo();
      try {
        event.target.unMute(); // Попытка включить звук сразу
        console.log("Звук включён автоматически");
      } catch (e) {
        console.warn("Браузер запретил авторазмут");
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        currentIndex = (currentIndex + 1) % videos.length;
        player.loadVideoById(videos[currentIndex]);
      }
    }

    function onPlayerError(event) {
      console.warn('Ошибка загрузки видео. Пропускаем…');
      currentIndex = (currentIndex + 1) % videos.length;
      player.loadVideoById(videos[currentIndex]);
    }

    // Кнопка отключения звука
    document.getElementById("mute-button").addEventListener("click", function() {
      player.mute();
    });

    // Переключение вручную по клавишам
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight') {
        currentIndex = (currentIndex + 1) % videos.length;
        player.loadVideoById(videos[currentIndex]);
      }
      if (e.key === 'ArrowLeft') {
        currentIndex = (currentIndex - 1 + videos.length) % videos.length;
        player.loadVideoById(videos[currentIndex]);
      }
    });
  </script>
</body>
</html>
