<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Круг ТВ</title>
  <!-- Open Graph для соцсетей -->
  <meta property="og:title" content="МИШКА ТВ — Круг 24/7" />
  <meta property="og:description" content="Круг по кругу. Эфир Михаила Круга без остановки — с VHS шумом, телевизором и душой." />
  <meta property="og:image" content="https://mishakaifuev.github.io/mishka-tv/preview.png" />
  <meta property="og:url" content="https://mishakaifuev.github.io/mishka-tv/" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="МИШКА ТВ — Круг 24/7" />
  <meta name="twitter:description" content="Михаил Круг в непрерывном эфире. С любовью, с VHS, с отголоском 90-х." />
  <meta name="twitter:image" content="https://mishakaifuev.github.io/mishka-tv/preview.png" />

  <link rel="stylesheet" href="style.css" />
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <div class="container">
    <div class="video-frame">
      <div class="live-tag">ЭФИР</div>
      <div id="player"></div>
    </div>
    <img src="logo.png" class="logo" alt="МИШКА ТВ" />
    <img src="tv.png" class="tv" alt="Телевизор" />
    <div class="vhs-noise"></div>
  </div>

  <div class="ticker">
    <p>Сегодня в эфире: Владимирский Централ · Кольщик · Звёздная пурга · Таганка · Михаил Круг в студии "РетроТВ"</p>
  </div>

  <button id="mute-button">🔇 Выключить звук</button>
  <button id="start-button">▶ Включить эфир</button>

  <style>
    #start-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      padding: 20px 40px;
      background: #cc0000;
      color: white;
      border: none;
      border-radius: 12px;
      z-index: 1000;
      cursor: pointer;
    }
  </style>

  <script>
    const videos = [
      '_wnQ3Ow02yQ',
      'mlOeHmUTbwg',
      '7C7DLnCYrP8'
    ];

    let player;
    let currentIndex = 0;

    document.getElementById("start-button").addEventListener("click", () => {
      document.getElementById("start-button").style.display = "none";

      player = new YT.Player('player', {
        height: '540',
        width: '676',
        videoId: videos[currentIndex],
        playerVars: {
          autoplay: 1,
          controls: 0,
          rel: 0,
          mute: 0,
          modestbranding: 1,
          fs: 0
        },
        events: {
          'onReady': (event) => {
            event.target.playVideo();
          },
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    });

    function onYouTubeIframeAPIReady() {
      // инициализация только по нажатию кнопки
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        currentIndex = (currentIndex + 1) % videos.length;
        player.loadVideoById(videos[currentIndex]);
      }
    }

    function onPlayerError(event) {
      console.warn('Ошибка загрузки видео. Пропускаем…');
      currentIndex = (currentIndex + 1) % videos.length;
      player.loadVideoById(videos[currentIndex]);
    }

    document.getElementById("mute-button").addEventListener("click", function() {
      if (player && player.mute) player.mute();
    });

    document.addEventListener('keydown', function(e) {
      if (!player) return;
      if (e.key === 'ArrowRight') {
        currentIndex = (currentIndex + 1) % videos.length;
        player.loadVideoById(videos[currentIndex]);
      }
      if (e.key === 'ArrowLeft') {
        currentIndex = (currentIndex - 1 + videos.length) % videos.length;
        player.loadVideoById(videos[currentIndex]);
      }
    });
  </script>
</body>
</html>
